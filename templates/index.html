<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Web Analítica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Pokédex Analítica</h1>
        <p>Busca un Pokémon por su nombre o ID (ej. 1, 25, pikachu).</p>
        
        <form method="POST" action="/">
            <label for="nombre" class="sr-only">Nombre del Pokémon:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Pikachu, Charizard..." required>
            <button type="submit" class="button">Buscar</button>
        </form>
    </div>
</body>
</html>
